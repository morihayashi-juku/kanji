<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢字プリントメーカー（小1〜小3・東京書籍）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1d1f; --sub:#6b6b70; --line:#d8d6cf; --bg:#f4f2ec; --card:#fff;
  --accent:#2f6b4f; --accent2:#e9f1ec; --red:#d0021b;
  --kyokasho:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","UD デジタル 教科書体 NK-R","YuKyokasho","游教科書体","Klee One","Hiragino Mincho ProN",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}

/* ===== 操作パネル ===== */
.panel{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.panel-inner{max-width:1100px;margin:0 auto;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.brand{width:100%;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--kyokasho);font-size:22px;margin:0;font-weight:600;letter-spacing:.04em}
.brand small{color:var(--sub);font-size:13px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--sub);font-weight:600}
select{font:inherit;font-size:16px;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
#unitSel{min-width:min(460px,86vw)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:15px;font-weight:600;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;touch-action:manipulation}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:active{transform:translateY(1px)}
.unitinfo{width:100%;font-size:13px;color:var(--sub);line-height:1.7}
.unitinfo b{color:var(--ink);font-family:var(--kyokasho);font-size:15px;letter-spacing:.05em}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button{padding:7px 12px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent);color:var(--accent)}

/* ===== プレビュー ===== */
#preview{padding:18px 0 60px}
.pagewrap{margin:0 auto 18px;width:calc(210mm * var(--z));height:calc(297mm * var(--z));}
.pagewrap .page{zoom:var(--z);box-shadow:0 4px 18px rgba(0,0,0,.12)}
.pagelabel{max-width:calc(210mm * var(--z));margin:0 auto 6px;font-size:12px;color:var(--sub)}
.empty{max-width:640px;margin:40px auto;text-align:center;color:var(--sub);line-height:1.9}

/* ===== プリント本体（A4横） ===== */
.page{width:210mm;height:297mm;background:#fff;padding:9mm 10mm 8mm;display:flex;flex-direction:column;overflow:hidden;font-family:var(--kyokasho);color:#000;position:relative}
.ph{display:flex;align-items:flex-end;gap:4mm;border-bottom:.5mm solid #000;padding-bottom:2mm;height:17mm;flex:none}
.ph .ttl{font-size:6.6mm;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.ph .rng{font-size:3mm;line-height:1.3;flex:1;min-width:0}
.ph .rng span{display:block;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ph .nm{display:flex;align-items:flex-end;gap:2mm;font-size:3.8mm;white-space:nowrap}
.ph .nm i{display:inline-block;width:34mm;border-bottom:.3mm solid #000;height:7mm}
.ph .sc{font-size:3.8mm;border:.4mm solid #000;border-radius:2mm;padding:1.2mm 2.2mm;white-space:nowrap}
.ph .sc i{display:inline-block;width:9mm}
.ph .ansmark{color:var(--red);border:.5mm solid var(--red);border-radius:2mm;padding:.5mm 2mm;font-size:4.4mm;font-weight:600}
.howto{font-size:3.8mm;margin:2.2mm 0 0;flex:none;line-height:1.5}
.howto b{display:inline-block;width:3.4mm;height:3.4mm;border:.9mm solid #000;vertical-align:-.3mm;margin:0 .6mm}
.tier{flex:1;min-height:0;display:flex;margin-top:3mm}
.tier+.tier{border-top:.35mm solid #000;padding-top:3mm}
.qs{flex:1;writing-mode:vertical-rl;font-size:var(--fs);line-height:1;overflow:hidden}
.q{block-size:calc(190mm / var(--n));inline-size:100%;padding-block-start:var(--gutter);padding-inline-start:1mm;border-left:.25mm dashed #b9b9b9;white-space:nowrap;line-height:1.25;overflow:hidden}
.q:last-child{border-left:none}
.num{font-size:4.4mm;margin-inline-end:.35em;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
.sp{display:inline-block;inline-size:.45em}
.yq{display:inline-block;position:relative;border-right:.45mm solid #000;line-height:1.15;padding-block:0 .3mm}
.ybox{position:absolute;left:100%;top:0;margin-left:1.8mm;width:12.5mm;border:.4mm solid #000;background:#fff;writing-mode:vertical-rl;font-size:6.6mm;line-height:1;padding-top:1.6mm;color:var(--red);text-align:start;display:flex;justify-content:center}
.ybox span{font-size:1em}
.wq{display:inline-block;position:relative;block-size:2.2em;border:.4mm solid #000;vertical-align:middle;margin-inline:.1em;line-height:1}
.wq.okuri{border-width:1.1mm}
.wq.okuri .wk{margin-left:2.2mm}
.wk{position:absolute;left:100%;top:0;height:100%;margin-left:2mm;font-size:.52em;line-height:1;display:flex;justify-content:space-around;writing-mode:vertical-rl;letter-spacing:0}
.wans{position:absolute;inset:0;display:flex;justify-content:space-evenly;align-items:center;color:var(--red);font-size:1.3em;line-height:1}
.wans .ok{font-size:.75em}
.foot{position:absolute;right:10mm;bottom:3mm;font-size:2.8mm;color:#888;font-family:sans-serif}

/* ===== データを見る ===== */
#dataview{max-width:1100px;margin:0 auto;padding:18px}
#dataview h2{font-family:var(--kyokasho);font-size:22px;margin:22px 0 8px}
.dunit{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}
.dunit h3{margin:0 0 6px;font-size:15px}
.dunit h3 small{color:var(--sub);font-weight:400}
.ditem{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;padding:6px 0;border-top:1px dashed #e4e2dc;font-size:14px}
.ditem:first-of-type{border-top:none}
.ditem .k{font-family:var(--kyokasho);font-size:26px;line-height:1.1}
.ditem .k small{display:block;font-size:11px;color:var(--sub);font-family:sans-serif}
.ditem .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:#eee;margin-right:6px}
.ditem .tag.Y{background:#e7f0fb}.ditem .tag.T{background:#fbefe2}
.ditem ul{margin:2px 0 0;padding-left:1.2em;font-family:var(--kyokasho);font-size:16px;line-height:1.7}
.ditem u{text-decoration-thickness:2px;text-underline-offset:3px}
.ditem rt{font-size:10px}

@media screen and (max-width:700px){ .tabs{margin-left:0} }

/* ===== 印刷 ===== */
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .panel,.pagelabel,#dataview,.empty{display:none!important}
  #preview{padding:0}
  .pagewrap{width:auto;height:auto;margin:0}
  .pagewrap .page{zoom:1;box-shadow:none}
  .page{break-after:page;page-break-after:always}
  .noprint{display:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<div class="panel">

    <div class="brand"><h1>漢字プリントメーカー</h1><small>東京書籍「新しい国語」小1〜小3｜A4たて・2段・縦書き</small>

</div>

/* ---------- 共通 ---------- */
const CIRC = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟㊱㊲㊳㊴㊵';
const isKanji = c => /[一-鿿々]/.test(c);
const kanjiOf = s => [...s].filter(isKanji);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} } };

// 漢字 → 習う位置（学年・単元）
const LEARN = {};
DATA.forEach(g => g.units.forEach((u, ui) => u.items.forEach(it => { if (it.type === 'K') LEARN[it.word] = [g.grade, ui]; })));
const before = (a, b) => a[0] < b[0] || (a[0] === b[0] && a[1] <= b[1]);

/* ---------- 画面 ---------- */
const $ = id => document.getElementById(id);
for (let i = 1; i <= 10; i++) $('setSel').insertAdjacentHTML('beforeend', `<option value="${i}">${i}まい</option>`);

function fillUnits() {
  const g = +$('gradeSel').value;
  const units = DATA[g - 1].units;
  $('unitSel').innerHTML = units.map((u, i) => {
    const ks = u.items.filter(it => it.type === 'K').map(it => it.word).join('');
    return `<option value="${i}">${CIRC[i] || (i + 1)} ${esc(u.title)}${ks ? '（' + ks + '）' : ''}</option>`;
  }).join('');
}
function showInfo() {
  const g = +$('gradeSel').value, ui = +$('unitSel').value;
  const r = ranges(g, ui);
  const nk = r.newUnits.flatMap(i => DATA[g - 1].units[i].items.filter(it => it.type === 'K').map(it => it.word)).join('');
  const nu = r.newUnits.map(i => CIRC[i]).join('');
  $('unitInfo').innerHTML = `新しい範囲（約7割）：<b>${nu}</b> ${nk ? '<b>' + nk + '</b>' : ''}　｜　復習（約3割）：${r.oldLabel}`;
}

/* ---------- 出題のしくみ ---------- */
// 新しい範囲：えらんだ単元から前へ、じゅうぶんな量になるまでさかのぼる
function ranges(g, ui) {
  const units = DATA[g - 1].units;
  // 書き10問＋読み10問を新しい範囲から出せるだけの量（新出漢字16字以上、読みかえ等をふくめて24以上）
  const newUnits = []; let cnt = 0, all = 0;
  for (let i = ui; i >= 0; i--) {
    newUnits.unshift(i);
    cnt += units[i].items.filter(it => it.type === 'K').length;
    all += units[i].items.length;
    if (cnt >= 16 && all >= 24) break;
  }
  // 復習：同じ学年の、新しい範囲より前の単元＋前の学年すべて（前の学年は3割のうち約半分）
  const sameUnits = [], prevUnits = [];
  for (let i = 0; i < newUnits[0]; i++) sameUnits.push([g, i]);
  for (let gg = 1; gg < g; gg++) DATA[gg - 1].units.forEach((u, i) => prevUnits.push([gg, i]));
  const oldUnits = sameUnits.concat(prevUnits);
  const parts = [];
  if (sameUnits.length) parts.push(`小${g}の${CIRC[0]}〜${CIRC[newUnits[0] - 1]}`);
  if (prevUnits.length) parts.push(`${[...Array(g - 1)].map((_, i) => '小' + (i + 1)).join('・')}の漢字`);
  const oldLabel = parts.length ? parts.join('＋') : 'なし（新しい範囲だけで作ります）';
  return { newUnits, sameUnits, prevUnits, oldUnits, oldLabel };
}

function collect(list, learned) {
  // 使える例文だけをもった項目にする
  const out = [];
  list.forEach(({ it, g, ui }) => {
    const exs = it.ex.filter(ex => { const q = ex.find(p => p.q); return kanjiOf(q.q).every(c => learned(c)); });
    if (exs.length) out.push({ it, g, ui, exs });
  });
  return out;
}

const NR = 14, NW = 14; // 読み・書きの問題数
function makeSet(g, ui) {
  const here = [g, ui];
  const learned = c => LEARN[c] && before(LEARN[c], here);
  const { newUnits, sameUnits, prevUnits } = ranges(g, ui);
  const gather = pairs => pairs.flatMap(([gg, i]) => DATA[gg - 1].units[i].items.map(it => ({ it, g: gg, ui: i })));
  const newAll = collect(gather(newUnits.map(i => [g, i])), learned);
  const sameAll = collect(gather(sameUnits), learned);
  const prevAll = collect(gather(prevUnits), learned);
  const oldAll = sameAll.concat(prevAll);
  const all = newAll.concat(oldAll);
  const nK = all.filter(x => x.it.type === 'K').length, nYT = all.length - nK;

  // 書きに使う漢字の数（漢字が少ない最初の単元では、読みと書きで分け合う）
  let wDistinct = (nK + nYT >= NR + NW) ? Math.min(NW, nK - Math.max(0, NR - nYT)) : Math.round(nK * NW / (NR + NW));
  wDistinct = Math.max(1, Math.min(NW, nK, wDistinct));

  // ---- 書き（新出漢字だけ）
  const onlyK = a => shuffle(a.filter(x => x.it.type === 'K'));
  const W = pickMix(onlyK(newAll), onlyK(sameAll), onlyK(prevAll), wDistinct, Math.round(wDistinct * 0.7));
  const writeK = new Set(W.map(x => x.it.word));
  const prefer = x => ex => kanjiOf(ex.find(p => p.q).q).every(c => c === x.it.word || !writeK.has(c));
  const writing = assign(fill(W, NW), prefer);
  const usedW = new Set();
  writing.forEach(w => kanjiOf(w.ex.find(p => p.q).q).forEach(c => usedW.add(c)));

  // ---- 読み（新出漢字＋読みかえ＋特別な読み）。書きに出た漢字は使わない
  const goodR = x => {
    const exs = x.exs.filter(ex => kanjiOf(ex.find(p => p.q).q).every(c => !usedW.has(c)));
    return exs.length ? { ...x, exs } : null;
  };
  const ok = a => shuffle(a.map(goodR).filter(Boolean));
  const R = pickMix(ok(newAll), ok(sameAll), ok(prevAll), NR, Math.round(NR * 0.7));
  const reading = assign(fill(R, 14), () => () => true);
  return { reading: spread(reading), writing: spread(writing), hidden: usedW, learned };
}

function pickMix(nw, same, prev, total, wantNew) {
  // 新しい範囲 約7割／復習 約3割（復習のうち約半分は前の学年から）。足りない分はほかからおぎなう
  const wantPrev = prev.length ? Math.ceil((total - wantNew) * 0.4) : 0;
  let a = nw.slice(0, wantNew), c = prev.slice(0, wantPrev);
  let b = same.slice(0, total - a.length - c.length);
  if (a.length + b.length + c.length < total) c = prev.slice(0, total - a.length - b.length);
  if (a.length + b.length + c.length < total) a = nw.slice(0, total - b.length - c.length);
  return a.concat(b, c);
}
// 問題数に足りないときは、同じ漢字の「別の例文」でおぎなう
function fill(list, total) {
  const res = list.slice();
  if (!list.length) return res;
  let k = 0;
  while (res.length < total && k < list.length * 6) {
    const p = list[k % list.length];
    if (res.filter(r => r.it === p.it).length < p.exs.length) res.push(p);
    k++;
  }
  return res;
}
// 項目ごとに例文をわりあてる（同じ例文は使わない）
function assign(list, preferFn) {
  const queues = new Map();
  return list.map(x => {
    if (!queues.has(x.it)) {
      const f = preferFn(x);
      const sh = shuffle(x.exs);
      queues.set(x.it, sh.filter(f).concat(sh.filter(e => !f(e))));
    }
    const ex = queues.get(x.it).shift();
    return { x, ex };
  });
}
// 並べかえ（同じ漢字がとなり合わないように）
function spread(list) {
  let best = shuffle(list);
  for (let t = 0; t < 30; t++) {
    const ok = best.every((v, i) => i === 0 || v.x.it !== best[i - 1].x.it);
    if (ok) break;
    best = shuffle(list);
  }
  return best;
}

/* ---------- プリントの組み立て ---------- */
const EM_K = 2.5, EM_O = 1.6; // 書きのマスの長さ（漢字1字・送りがな1字あたり、文字の大きさの何倍か）
function renderSentence(ex, mode, hidden, learned, grade, ans) {
  let h = '';
  ex.forEach(p => {
    if (p.t !== undefined) {
      h += esc(p.t).replace(/ /g, grade <= 2 ? '<span class="sp"></span>' : '');
    } else if (p.w !== undefined) {
      const ks = kanjiOf(p.w);
      const show = ks.every(c => learned(c) && !hidden.has(c));
      h += esc(show ? p.w : p.r);
    } else if (p.q !== undefined) {
      if (mode === 'R') {
        // 読みがなのらん：ひらがな1字につき9mm＋よゆう。漢字の長さより短くはしない
        const len = Math.max([...p.q].length * 8, [...p.r].length * 9 + 6);
        h += `<span class="yq">${esc(p.q)}<span class="ybox" style="height:${len}mm">${ans ? '<span>' + esc(p.r) + '</span>' : ''}</span></span>${esc(p.o)}`;
      } else {
        const nk = [...p.q].length, no = [...p.o].length;
        const L = nk * EM_K + no * EM_O;                       // わくの長さは字数（漢字・送りがな）で決める
        const nkana = [...(p.r + p.o)].length;
        const kfs = Math.min(0.52, (L - 0.2) / nkana / 1.05); // ふりがなが入りきらないときは小さくする
        const kana = [...(p.r + p.o)].map(c => `<span>${esc(c)}</span>`).join('');
        const a = ans ? `<span class="wans">${[...p.q].map(c => `<span>${esc(c)}</span>`).join('')}${[...p.o].map(c => `<span class="ok">${esc(c)}</span>`).join('')}</span>` : '';
        h += `<span class="wq${no ? ' okuri' : ''}" style="inline-size:${L.toFixed(2)}em">${a}<span class="wk" style="font-size:${kfs.toFixed(3)}em">${kana}</span></span>`;
      }
    }
  });
  return h;
}

function pageHTML(set, mode, ans, meta) {
  const qs = mode === 'R' ? set.reading : set.writing;
  const per = 7;                                    // 1段の問題数（読み・書きとも）
  const style = `--n:${per};--fs:${mode === 'R' ? '5.6mm' : '7mm'};--gutter:${mode === 'R' ? '15mm' : '1.15em'}`;
  const col = (q, i) => `<div class="q"><span class="num">${CIRC[i]}</span>${renderSentence(q.ex, mode, set.hidden, set.learned, meta.grade, ans)}</div>`;
  const tiers = [qs.slice(0, per), qs.slice(per)].map((part, t) =>
    `<div class="tier"><div class="qs" style="${style}">${part.map((q, i) => col(q, t * per + i)).join('')}</div></div>`).join('');
  const ttl = mode === 'R' ? '漢字の読み' : '漢字の書き';
  const how = mode === 'R' ? '――線の漢字の読みがなを、右の□に書きましょう。'
    : '□に、ひらがなを漢字と送りがなで書きましょう。<br>わくが<b></b>太いところは、送りがなもいっしょに書きます。';
  return `<div class="page"><div class="ph">
      <div class="ttl">${ttl}</div>
      <div class="rng"><span>小${meta.grade}　${esc(meta.unitLabel)} まで</span><span>パターン ${meta.pat}</span></div>
      ${ans ? '<div class="ansmark">こたえ</div>' : `<div class="nm">名前<i></i></div><div class="sc"><i></i>／${qs.length}</div>`}
    </div><div class="howto">${how}</div>
    ${tiers}
    <div class="foot">${mode === 'R' ? '1' : '2'}ページ目${ans ? '（こたえ）' : ''}</div></div>`;
}

// 1列に入りきらないときは、その列だけ文字を小さくする
function fitColumns() {
  document.querySelectorAll('#preview .q').forEach(q => {
    q.style.fontSize = '';
    let k = 1, n = 0;
    while (q.scrollHeight > q.clientHeight + 1 && n < 14) { k *= 0.94; q.style.fontSize = `calc(var(--fs) * ${k.toFixed(3)})`; n++; }
  });
}

let SETS = [], META = null;
function make() {
  const g = +$('gradeSel').value, ui = +$('unitSel').value, n = +$('setSel').value;
  const u = DATA[g - 1].units[ui];
  META = { grade: g, unitLabel: `${CIRC[ui]}「${u.title}」` };
  SETS = [];
  for (let i = 0; i < n; i++) SETS.push(makeSet(g, ui));
  draw();
  store.set('kp-sel', JSON.stringify({ g, ui, n }));
}

function draw(which) {
  if (!SETS.length) return;
  const pats = 'ABCDEFGHIJ';
  const q = [], a = [];
  SETS.forEach((s, i) => {
    const m = { ...META, pat: pats[i] };
    q.push([`パターン${pats[i]}・問題1（読み）`, pageHTML(s, 'R', false, m)], [`パターン${pats[i]}・問題2（書き）`, pageHTML(s, 'W', false, m)]);
    a.push([`パターン${pats[i]}・こたえ1（読み）`, pageHTML(s, 'R', true, m)], [`パターン${pats[i]}・こたえ2（書き）`, pageHTML(s, 'W', true, m)]);
  });
  const list = which === 'Q' ? q : which === 'A' ? a : q.concat(a);
  $('preview').innerHTML = list.map(([lb, h]) => `<div class="pagelabel">${lb}</div><div class="pagewrap">${h}</div>`).join('');
  fitZoom();
  fitColumns();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitColumns);
}

function fitZoom() {
  const mm = 96 / 25.4;
  const w = Math.min(window.innerWidth - 24, 900);
  const z = Math.min(1, w / (210 * mm));
  document.documentElement.style.setProperty('--z', z.toFixed(4));
}
window.addEventListener('resize', fitZoom);

function doPrint(which) {
  if (!SETS.length) make();
  draw(which);
  setTimeout(() => { window.print(); }, 150);
}
window.addEventListener('afterprint', () => draw());

/* ---------- データを見る ---------- */
function renderData() {
  let h = '<p style="color:var(--sub);font-size:13px">プリントに出る漢字・読み・例文の一覧です。下線が出題する語です。まだ習っていない漢字は、プリントではひらがなで出ます。</p>';
  DATA.forEach(g => {
    h += `<h2>小学${g.grade}年</h2>`;
    g.units.forEach((u, ui) => {
      h += `<div class="dunit"><h3>${CIRC[ui]} ${esc(u.title)} <small>（教科書 ${esc(u.pages)}）</small></h3>`;
      if (!u.items.length) h += '<div style="color:var(--sub);font-size:13px">新しい漢字・読みかえはありません</div>';
      u.items.forEach(it => {
        const tag = it.type === 'K' ? '' : `<span class="tag ${it.type}">${it.type === 'Y' ? '読みかえ' : '特別な読み'}</span>`;
        const exs = it.ex.map(ex => '<li>' + ex.map(p => p.t !== undefined ? esc(p.t) : p.w !== undefined ? `<ruby>${esc(p.w)}<rt>${esc(p.r)}</rt></ruby>` : `<u><ruby>${esc(p.q)}<rt>${esc(p.r)}</rt></ruby></u>${esc(p.o)}`).join('') + '</li>').join('');
        h += `<div class="ditem"><div class="k">${esc(it.type === 'K' ? it.word : '')}${it.type !== 'K' ? '' : `<small>${esc(it.yomi)}</small>`}</div><div>${tag}${it.type !== 'K' ? `<b style="font-family:var(--kyokasho);font-size:17px">${esc(it.word)}</b>（${esc(it.yomi)}）` : ''}<ul>${exs}</ul></div></div>`;
      });
      h += '</div>';
    });
  });
  $('dataview').innerHTML = h;
}
function tab(data) {
  $('tabPrint').setAttribute('aria-pressed', !data); $('tabData').setAttribute('aria-pressed', data);
  $('preview').hidden = data; $('dataview').hidden = !data;
  if (data && !$('dataview').innerHTML) renderData();
}

/* ---------- はじめに ---------- */
$('gradeSel').addEventListener('change', () => { fillUnits(); showInfo(); });
$('unitSel').addEventListener('change', showInfo);
$('makeBtn').addEventListener('click', () => { tab(false); make(); });
$('printQ').addEventListener('click', () => { tab(false); doPrint('Q'); });
$('printA').addEventListener('click', () => { tab(false); doPrint('A'); });
$('printAll').addEventListener('click', () => { tab(false); doPrint(); });
$('tabPrint').addEventListener('click', () => tab(false));
$('tabData').addEventListener('click', () => tab(true));
(function init() {
  let s = null; try { s = JSON.parse(store.get('kp-sel')); } catch (e) {}
  if (s && s.g) $('gradeSel').value = s.g;
  fillUnits();
  if (s && s.ui !== undefined && s.ui < $('unitSel').options.length) $('unitSel').value = s.ui;
  if (s && s.n) $('setSel').value = s.n;
  showInfo(); fitZoom();
})();
</script>
